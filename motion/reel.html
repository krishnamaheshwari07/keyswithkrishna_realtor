<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Playfair Display";font-weight:800;src:url(../posts/assets/fonts/playfair-display-latin-800-normal.woff2)}
@font-face{font-family:"Playfair Display";font-weight:900;src:url(../posts/assets/fonts/playfair-display-latin-900-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(../posts/assets/fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../posts/assets/fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../posts/assets/fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(../posts/assets/fonts/inter-latin-800-normal.woff2)}
:root{--teal:#032b38;--teal2:#04566b;--green:#00784e;--lime:#6ebe28;--gold:#fac951;--navy:#082035;--white:#fff}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif}
#bg{position:absolute;inset:0;background:linear-gradient(160deg,#032b38 0%,#04566b 55%,#00784e 100%)}
body.light #bg{background:#fff}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45}
#b1{width:700px;height:700px;background:#6ebe28;left:-250px;top:200px}
#b2{width:600px;height:600px;background:#fac951;right:-260px;top:1100px;opacity:.25}
body.light .blob{opacity:.18}
#prog{position:absolute;left:0;top:0;height:10px;background:var(--gold);z-index:9}
header{position:absolute;left:80px;right:80px;top:70px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.mark{color:#fff;font-weight:800;letter-spacing:.2em;font-size:30px}
.pill{background:var(--gold);color:var(--navy);font-weight:800;letter-spacing:.14em;font-size:26px;padding:16px 30px;border-radius:40px}
body.light .mark{color:var(--teal)}
footer{position:absolute;left:80px;right:80px;bottom:44px;z-index:5;color:#fff;font-weight:700;font-size:30px;line-height:1.75}
footer .rule{height:5px;background:var(--gold);margin-bottom:22px}
footer .r1 span{margin-left:34px}
body.light footer{color:var(--teal)}
.scene{position:absolute;inset:0;will-change:transform,opacity,filter}
.area{position:absolute;left:80px;top:200px;color:var(--gold);font-weight:800;letter-spacing:.22em;font-size:28px}
.hook{position:absolute;left:80px;right:80px;top:270px;font-family:"Playfair Display";font-weight:900;font-size:118px;line-height:1.06;color:#fff}
body.light .hook,body.light .pt,body.light .cta{color:var(--teal)}
.hook .w,.pt .w,.cta .w{display:inline-block;margin-right:.24em}
.hl{color:var(--gold)}
.badge{position:absolute;left:80px;top:250px;display:flex;align-items:center;gap:26px}
.num{width:96px;height:96px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:800;font-size:54px;display:flex;align-items:center;justify-content:center}
.of{color:#fff;font-weight:800;letter-spacing:.2em;font-size:30px}
body.light .of{color:var(--teal)}
.pt{position:absolute;left:80px;right:80px;top:400px;font-weight:800;font-size:76px;line-height:1.14;color:#fff}
.propbox{position:absolute;left:90px;width:900px;height:760px;top:900px}
.prop{width:900px;height:760px;overflow:visible;filter:drop-shadow(0 22px 30px rgba(3,43,56,.28))}
svg g[data-anim]{transform-box:view-box}
.head{position:absolute;right:20px;bottom:240px;width:620px}
.head img{width:100%;display:block;filter:drop-shadow(0 30px 40px rgba(0,0,0,.35))}
.wedge{position:absolute;right:0;bottom:240px;width:560px;height:700px;background:var(--gold);clip-path:polygon(32% 0,100% 0,100% 100%,0 100%)}
.cta{position:absolute;left:80px;right:80px;top:300px;font-family:"Playfair Display";font-weight:900;font-size:100px;line-height:1.08;color:#fff}
.phone{position:absolute;left:80px;top:840px;background:var(--gold);color:var(--navy);font-weight:800;font-size:68px;padding:22px 44px;border-radius:70px}
.fine{position:absolute;left:80px;top:1010px;width:460px;color:#cfe3e6;font-size:26px;line-height:1.4}
body.light .fine{color:#4a6a72}
body.light .hl{color:#00784e}
body.light .area{color:#04566b}
</style></head><body>
<div id="bg"><div class="blob" id="b1"></div><div class="blob" id="b2"></div></div>
<div id="prog"></div>
<header><div class="mark">KEYS WITH KRISHNA</div><div class="pill" id="tag"></div></header>
<div id="scenes"></div>
<footer><div class="rule"></div><div class="r1">Krishna Rander · Realtor®<span>905-452-4298</span></div><div>PROPERTY.CA INC., Brokerage</div></footer>
<script src="props.js"></script>
<script>
const S = window.SPEC, D = window.DURS, START = []; let acc = 0; D.forEach(d => { START.push(acc); acc += d; }); const TOTAL = acc;
document.body.className = S.theme === "cream" ? "light" : "";
document.getElementById("tag").textContent = S.tag;
const words = (txt, base, step) => txt.split(/\s+/).map((w, i) => {
  const hl = w.startsWith("*"); w = w.replace(/\*/g, "");
  return `<span class="w${hl ? " hl" : ""}" data-anim="wordUp:${(base + i * step).toFixed(2)}:0.38">${w}</span>`; }).join(" ");
const root = document.getElementById("scenes");
S.scenes.forEach((sc, k) => {
  const el = document.createElement("div"); el.className = "scene"; el.dataset.k = k; let h = "";
  if (sc.kind === "hook") {
    h = `<div class="area" data-anim="fadeUp:0.05:0.35">${S.area}</div>
      <div class="wedge" data-anim="wipeIn:0.1:0.5"></div><div class="head" data-anim="headIn:0.2:0.6"><img src="../posts/assets/headshot-cutout.png"></div>
      <div class="hook">${words(sc.text, 0.15, 0.09)}</div>`;
  } else if (sc.kind === "point") {
    h = `<div class="area" data-anim="fadeUp:0.0:0.3">${S.area}</div>
      <div class="badge"><div class="num" data-anim="popIn:0.05:0.4">${sc.n}</div><div class="of" data-anim="fadeUp:0.15:0.35">STEP ${sc.n} OF ${sc.of}</div></div>
      <div class="pt">${words(sc.text, 0.12, 0.05)}</div>
      <div class="propbox">${(PROPS[sc.prop] || PROPS.house)()}</div>`;
  } else {
    h = `<div class="wedge" data-anim="wipeIn:0.1:0.5"></div><div class="head" data-anim="headIn:0.2:0.6"><img src="../posts/assets/headshot-cutout.png"></div>
      <div class="cta">${words(sc.text, 0.1, 0.07)}</div>
      <div class="phone" data-anim="pulse:0.6:${Math.max(1, D[k] - 0.6).toFixed(2)}">905-452-4298</div>
      <div class="fine" data-anim="fadeUp:0.8:0.4">${sc.fine || ""}</div>`;
  }
  el.innerHTML = h; root.appendChild(el);
});
const ease = p => 1 - Math.pow(1 - p, 3), back = p => { const c = 1.70158; p -= 1; return 1 + (c + 1) * p * p * p + c * p * p; };
const A = {
  wordUp: p => `opacity:${Math.min(1, p * 2)};transform:translateY(${(1 - back(p)) * 60}px) scale(${0.9 + 0.1 * ease(p)})`,
  fadeUp: p => `opacity:${p};transform:translateY(${(1 - ease(p)) * 30}px)`,
  popIn: p => `opacity:${Math.min(1, p * 3)};transform:scale(${back(p)})`,
  headIn: p => `opacity:${Math.min(1, p * 2)};transform:translateY(${(1 - back(p)) * 400}px)`,
  wipeIn: p => `clip-path:polygon(32% ${100 - 100 * ease(p)}%,100% ${100 - 100 * ease(p)}%,100% 100%,0 100%)`,
  flyInRight: p => `opacity:${Math.min(1, p * 2)};transform:translateX(${(1 - back(p)) * 900}px) rotate(${(1 - ease(p)) * 25}deg)`,
  flyInLeft: p => `opacity:${Math.min(1, p * 2)};transform:translateX(${-(1 - back(p)) * 900}px) rotate(${-(1 - ease(p)) * 25}deg)`,
  flyInTop: p => `opacity:${Math.min(1, p * 2)};transform:translateY(${-(1 - back(p)) * 800}px) rotate(${(1 - ease(p)) * 15}deg)`,
  riseIn: p => `opacity:${Math.min(1, p * 2)};transform:translateY(${(1 - back(p)) * 700}px)`,
  dropBang: p => { const r = p < 0.6 ? -40 + 50 * (p / 0.6) : 10 - 10 * ((p - 0.6) / 0.4); return `opacity:${Math.min(1, p * 4)};transform:rotate(${r}deg) translateY(${(1 - Math.min(1, p / 0.6)) * -300}px)`; },
  stamp: p => `opacity:${Math.min(1, p * 4)};transform:scale(${p < 0.6 ? 2.6 - 1.7 * (p / 0.6) : 0.9 + 0.1 * ((p - 0.6) / 0.4)})`,
  draw: p => `stroke-dasharray:1;stroke-dashoffset:${1 - ease(p)}`,
  swing: p => `opacity:${Math.min(1, p * 5)};transform:rotate(${Math.sin(p * Math.PI * 4) * 18 * (1 - p)}deg)`,
  dropIn: p => `opacity:${Math.min(1, p * 3)};transform:translateY(${-(1 - back(p)) * 600}px)`,
  growUp: p => `transform:scaleY(${back(p)})`,
  scan: p => `opacity:${Math.min(1, p * 5)};transform:translate(${Math.sin(p * Math.PI * 2) * -180}px,${Math.sin(p * Math.PI) * 60}px)`,
  coinDrop: p => `opacity:${p < 0.85 ? 1 : (1 - p) / 0.15};transform:translateY(${ease(p) * 230}px)`,
  pulse: p => `transform:scale(${1 + 0.06 * Math.max(0, Math.sin(p * Math.PI * 6))})`,
};
[0, 1, 2, 3, 4].forEach(i => { const ang = (i - 2) * 16; A["fan" + i] = p => `opacity:${Math.min(1, p * 3)};transform:rotate(${ang * back(p)}deg) translateY(${(1 - ease(p)) * 500}px)`; });
const TRANS = ["whip", "zoom", "slideUp"]; const TD = 0.32;
function trans(kind, p, dir) { // dir: 1 = entering (p 0->1), -1 = leaving (p 0->1)
  const e = ease(p);
  if (kind === "whip") { const x = dir > 0 ? (1 - e) * 1080 : -e * 1080; const b = Math.sin(p * Math.PI) * 26; return `transform:translateX(${x}px);filter:blur(${b}px)`; }
  if (kind === "zoom") { const s = dir > 0 ? 1.35 - 0.35 * e : 1 + 0.5 * e; return `transform:scale(${s});opacity:${dir > 0 ? e : 1 - e};filter:blur(${Math.sin(p * Math.PI) * 14}px)`; }
  const y = dir > 0 ? (1 - e) * 1920 : -e * 600; return `transform:translateY(${y}px);opacity:${dir > 0 ? 1 : 1 - e}`;
}
const anims = [...document.querySelectorAll("[data-anim]")].map(el => {
  const [n, dl, du] = el.dataset.anim.split(":"); const k = +el.closest(".scene").dataset.k; return { el, n, at: START[k] + +dl, du: +du };
});
window.renderAt = t => {
  document.getElementById("prog").style.width = (100 * t / TOTAL) + "%";
  document.getElementById("b1").style.transform = `translate(${Math.sin(t * 0.6) * 120}px,${Math.cos(t * 0.4) * 160}px)`;
  document.getElementById("b2").style.transform = `translate(${Math.cos(t * 0.5) * 140}px,${Math.sin(t * 0.7) * 120}px)`;
  document.querySelectorAll(".scene").forEach(el => {
    const k = +el.dataset.k, s = START[k], e = s + D[k], last = k === D.length - 1;
    if (t < s || (!last && t >= e + TD)) { el.style.cssText = "display:none"; return; }
    let css = "";
    if (!last && t >= e) css = trans(TRANS[k % 3], (t - e) / TD, -1);           // leaving, while the next one enters
    else if (k > 0 && t < s + TD) css = trans(TRANS[(k - 1) % 3], (t - s) / TD, 1);
    el.style.cssText = css + (!last && t >= e ? ";z-index:1" : ";z-index:2");
  });
  anims.forEach(a => { let p = (t - a.at) / a.du; p = Math.max(0, Math.min(1, p));
    if (a.n === "pulse" || a.n === "swing") { a.el.style.cssText = A[a.n](p); return; }
    a.el.style.cssText = A[a.n] ? A[a.n](p) : ""; });
};
window.TOTAL = TOTAL;
</script></body></html>

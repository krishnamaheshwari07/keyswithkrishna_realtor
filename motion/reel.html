<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Playfair Display";font-weight:800;src:url(../posts/assets/fonts/playfair-display-latin-800-normal.woff2)}
@font-face{font-family:"Playfair Display";font-weight:900;src:url(../posts/assets/fonts/playfair-display-latin-900-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(../posts/assets/fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../posts/assets/fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../posts/assets/fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(../posts/assets/fonts/inter-latin-800-normal.woff2)}
:root{--teal:#032b38;--teal2:#04566b;--green:#00784e;--lime:#6ebe28;--gold:#fac951;--navy:#082035;--white:#fff}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif}
#bg{position:absolute;inset:0;background:linear-gradient(160deg,#032b38 0%,#04566b 55%,#00784e 100%)}
body.light #bg{background:#fff}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45}
#b1{width:700px;height:700px;background:#6ebe28;left:-250px;top:200px}
#b2{width:600px;height:600px;background:#fac951;right:-260px;top:1100px;opacity:.25}
body.light .blob{opacity:.18}
#prog{position:absolute;left:0;top:0;height:10px;background:var(--gold);z-index:9}
/* Safe zones (Oct 29): Instagram/Facebook/YouTube cover the top ~220px (status bar, back, search) and the bottom ~450-600px (name, caption, buttons),
   so the brand bar sits under the top icons and the brokerage line moved up beside it; the scene content is scaled into the middle. */
header{position:absolute;left:80px;right:80px;top:228px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.mark{color:#fff;font-weight:800;letter-spacing:.2em;font-size:30px}
.pill{background:var(--gold);color:var(--navy);font-weight:800;letter-spacing:.14em;font-size:26px;padding:16px 30px;border-radius:40px}
body.light .mark{color:var(--teal)}
footer{position:absolute;left:80px;right:80px;top:310px;z-index:5;color:#fff;font-weight:700;font-size:26px;line-height:1.45}
footer .rule{height:4px;background:var(--gold);margin-top:14px}
footer .r1 span{margin-left:26px}
#scenes{position:absolute;inset:0;transform:translateY(272px) scale(.8);transform-origin:50% 0}
body.light footer{color:var(--teal)}
.scene{position:absolute;inset:0;will-change:transform,opacity,filter}
.area{position:absolute;left:80px;top:200px;color:var(--gold);font-weight:800;letter-spacing:.22em;font-size:28px}
.hook{position:absolute;left:80px;right:80px;top:270px;font-family:"Playfair Display";font-weight:900;font-size:118px;line-height:1.06;color:#fff}
body.light .hook,body.light .pt,body.light .cta{color:var(--teal)}
.hook .w,.pt .w,.cta .w{display:inline-block;margin-right:.24em}
.hl{color:var(--gold)}
.badge{position:absolute;left:80px;top:250px;display:flex;align-items:center;gap:26px}
.num{width:96px;height:96px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:800;font-size:54px;display:flex;align-items:center;justify-content:center}
.of{color:#fff;font-weight:800;letter-spacing:.2em;font-size:30px}
body.light .of{color:var(--teal)}
.pt{position:absolute;left:80px;right:80px;top:400px;font-weight:800;font-size:76px;line-height:1.14;color:#fff}
.note{position:absolute;left:80px;right:80px;top:850px;color:#cfe3e6;font-size:26px;font-weight:500}
body.light .note{color:#4a6a72}
.hookstack{position:absolute;left:70px;right:70px;top:250px;display:flex;flex-direction:column;align-items:flex-start;gap:30px}
.hook2{font-family:"Playfair Display";font-weight:900;font-size:124px;line-height:1.02;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.25)}
body.light .hook2{color:var(--teal)}
.kick{background:var(--gold);color:var(--navy);font-weight:900;font-size:74px;padding:10px 34px;border-radius:22px;transform-origin:left center}
.tease{background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:40px;padding:14px 28px;border-radius:40px;border:3px solid var(--gold)}
body.light .tease{background:#eef6f3;color:var(--teal)}
.hookprop{top:980px;transform-origin:450px 380px}
/* news clipping on the hook of news Reels (Krishna, Oct 28): our own paraphrased headline in a newspaper-cutout style, outlet name as plain text, never a copied screenshot or logo */
.clip{position:absolute;left:95px;width:890px;top:1075px;transform-origin:50% 0;filter:drop-shadow(0 26px 34px rgba(0,0,0,.35))}
.clip .paper{background:#f6f2e8;padding:46px 52px 40px;clip-path:polygon(0 2%,4% 0,9% 1.6%,15% .2%,22% 1.8%,30% .3%,38% 1.5%,46% 0,55% 1.7%,63% .4%,71% 1.9%,80% .2%,88% 1.6%,95% .1%,100% 1.4%,99.4% 50%,100% 98%,94% 100%,86% 98.3%,78% 99.8%,69% 98.2%,60% 99.9%,51% 98.4%,42% 99.7%,33% 98.1%,24% 99.9%,15% 98.3%,7% 99.8%,0 98.5%,.6% 50%)}
.clip .csrc{display:flex;justify-content:space-between;font-family:Inter;font-weight:800;font-size:27px;letter-spacing:.12em;text-transform:uppercase;color:#5c5a52;border-bottom:3px double #8d897c;padding-bottom:16px;margin-bottom:22px}
.clip .chead{font-family:"Playfair Display";font-weight:900;font-size:64px;line-height:1.08;color:#141414}
.clip .chead .hl{background:linear-gradient(transparent 58%,rgba(250,201,81,.85) 58%);color:#141414}
.clip .cbody{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:12px 30px}
.clip .cbody i{display:block;height:13px;background:#d3cebf;border-radius:3px}
.clip .tape{position:absolute;top:-26px;left:50%;width:210px;height:56px;margin-left:-105px;background:rgba(250,201,81,.75);transform:rotate(-4deg)}
 .calcbox{position:absolute;left:80px;right:80px;top:880px;background:rgba(255,255,255,.96);border-radius:36px;padding:50px 50px 44px;box-shadow:0 30px 60px rgba(0,0,0,.25);border:6px solid var(--gold)}
.cval{font-weight:900;font-size:150px;line-height:1;color:var(--teal);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cform{margin-top:22px;font-weight:600;font-size:36px;color:#4a6a72}
.crun{position:absolute;left:80px;top:1370px;display:flex;align-items:center;gap:24px;background:var(--gold);color:var(--navy);border-radius:28px;padding:22px 36px;font-weight:800}
.crun span{font-size:32px;letter-spacing:.06em;text-transform:uppercase}.crun b{font-size:60px;font-variant-numeric:tabular-nums}
.note2{position:absolute;left:80px;right:80px;top:1560px;color:#cfe3e6;font-size:26px;font-weight:500;line-height:1.35}
body.light .note2{color:#4a6a72}
.tlabel{position:absolute;left:80px;right:80px;top:330px;font-family:"Playfair Display";font-weight:900;font-size:96px;line-height:1.06;color:#fff}
body.light .tlabel{color:var(--teal)}
.tval{position:absolute;left:80px;top:640px;font-weight:900;font-size:190px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 60px rgba(250,201,81,.45);transform-origin:left center}
body.light .tval{color:#00784e;text-shadow:none}
.tsub{position:absolute;left:80px;right:80px;top:870px;color:#fff;font-weight:700;font-size:44px}
body.light .tsub{color:var(--teal)}
.newsband{position:absolute;left:80px;top:260px;background:#e2574c;color:#fff;font-weight:900;letter-spacing:.16em;font-size:34px;padding:14px 28px;border-radius:12px;display:flex;align-items:center;gap:16px}
.newsband .dot{width:18px;height:18px;border-radius:50%;background:#fff}
.newscard{position:absolute;left:80px;right:80px;top:380px;background:#fff;border-radius:30px;padding:44px 48px;box-shadow:0 30px 60px rgba(0,0,0,.3);border-left:16px solid #e2574c}
.nsrc{font-weight:800;font-size:30px;color:#6b7f85;letter-spacing:.04em;margin-bottom:18px}
.nhead{font-family:"Playfair Display";font-weight:900;font-size:78px;line-height:1.08;color:#082035}
.propbox{position:absolute;left:90px;width:900px;height:760px;top:900px}
.prop{width:900px;height:760px;overflow:visible;filter:drop-shadow(0 22px 30px rgba(3,43,56,.28))}
svg g[data-anim]{transform-box:view-box}
.head{position:absolute;right:20px;bottom:240px;width:620px}
.head img{width:100%;display:block;filter:drop-shadow(0 30px 40px rgba(0,0,0,.35))}
.wedge{position:absolute;right:0;bottom:240px;width:560px;height:700px;background:var(--gold);clip-path:polygon(32% 0,100% 0,100% 100%,0 100%)}
.cta{position:absolute;left:80px;right:80px;top:300px;font-family:"Playfair Display";font-weight:900;font-size:100px;line-height:1.08;color:#fff}
.phone{position:absolute;left:80px;top:840px;background:var(--gold);color:var(--navy);font-weight:800;font-size:68px;padding:22px 44px;border-radius:70px}
.fine{position:absolute;left:80px;top:1010px;width:460px;color:#cfe3e6;font-size:26px;line-height:1.4}
body.light .fine{color:#4a6a72}
body.light .hl{color:#00784e}
body.light .area{color:#04566b}
</style></head><body>
<div id="bg"><div class="blob" id="b1"></div><div class="blob" id="b2"></div></div>
<div id="prog"></div>
<header><div class="mark">KEYS WITH KRISHNA</div><div class="pill" id="tag"></div></header>
<div id="scenes"></div>
<footer><div class="r1">Krishna Rander · Realtor®<span>905-452-4298</span></div><div>PROPERTY.CA INC., Brokerage</div><div class="rule"></div></footer>
<script src="props.js"></script>
<script>
const S = window.SPEC, D = window.DURS, START = []; let acc = 0; D.forEach(d => { START.push(acc); acc += d; }); const TOTAL = acc;
document.body.className = S.theme === "cream" ? "light" : "";
document.getElementById("tag").textContent = S.tag;
const words = (txt, base, step) => txt.split(/\s+/).map((w, i) => {
  const hl = w.startsWith("*"); w = w.replace(/\*/g, "");
  return `<span class="w${hl ? " hl" : ""}" data-anim="wordUp:${(base + i * step).toFixed(2)}:0.38">${w}</span>`; }).join(" ");
const root = document.getElementById("scenes");
S.scenes.forEach((sc, k) => {
  const el = document.createElement("div"); el.className = "scene"; el.dataset.k = k; let h = "";
  if (sc.kind === "hook") {   // Oct 26 hook redesign: short line on screen instantly, big moving visual, curiosity tease, no headshot
    const kick = sc.kick ? `<div class="kick" data-anim="kickIn:0.0:0.35">${sc.kick}</div>` : "";
    h = `<div class="area" data-anim="fadeUp:0.0:0.2">${S.area}</div>
      <div class="hookstack"><div class="hook2" data-anim="slam:0.0:0.28">${sc.text.replace(/\*([^\s]+)/g, '<span class="hl">$1</span>')}</div>${kick}
      ${sc.tease ? `<div class="tease" data-anim="teaseIn:0.55:0.35">${sc.tease}</div>` : ""}</div>
      ${sc.clip ? `<div class="clip" data-anim="clipIn:0.0:0.5"><div class="tape"></div><div class="paper">
          <div class="csrc"><span>${sc.clip.source || ""}</span><span>${sc.clip.date || ""}</span></div>
          <div class="chead">${(sc.clip.headline || "").replace(/\*([^\s]+)/g, '<span class="hl">$1</span>')}</div>
          <div class="cbody">${"<i></i>".repeat(8)}</div></div></div>`
        : `<div class="propbox hookprop" data-anim="shake:0.0:0.6">${(PROPS[sc.prop] || PROPS.house)()}</div>`}`;
  } else if (sc.kind === "news") {   // Market Watch: a sourced, dated headline card with a breaking-news banner
    h = `<div class="area" data-anim="fadeUp:0.0:0.3">${S.area}</div>
      <div class="newsband" data-anim="wipeL:0.05:0.35"><span class="dot"></span>MARKET WATCH</div>
      <div class="newscard" data-anim="riseIn:0.15:0.5"><div class="nsrc">${sc.source || ""}${sc.date ? " · " + sc.date : ""}</div>
        <div class="nhead">${words(sc.text, 0.4, 0.05)}</div></div>
      ${sc.note ? `<div class="note2" style="top:1180px" data-anim="fadeUp:0.8:0.4">${sc.note}</div>` : ""}
      <div class="propbox" style="top:1200px" data-anim="fadeUp:0.3:0.4"><div style="transform:scale(.55);transform-origin:center top">${PROPS.chart()}</div></div>`;
  } else if (sc.kind === "calc") {   // money-math step: label, big counting value, formula line, running total
    h = `<div class="area" data-anim="fadeUp:0.0:0.3">${S.area}</div>
      <div class="badge"><div class="num" data-anim="popIn:0.05:0.4">${sc.n}</div><div class="of" data-anim="fadeUp:0.15:0.35">STEP ${sc.n} OF ${sc.of}</div></div>
      <div class="pt">${words(sc.text, 0.12, 0.05)}</div>
      <div class="calcbox" data-anim="riseIn:0.25:0.5"><div class="cval" data-count="${sc.value}" data-at="0.45" data-du="0.9">${sc.value}</div>
        ${sc.formula ? `<div class="cform">${sc.formula}</div>` : ""}</div>
      ${sc.running ? `<div class="crun" data-anim="popIn:1.1:0.4"><span>Running total</span><b data-count="${sc.running}" data-at="1.2" data-du="0.6">${sc.running}</b></div>` : ""}
      ${sc.note ? `<div class="note2" data-anim="fadeUp:0.6:0.4">${sc.note}</div>` : ""}`;
  } else if (sc.kind === "total") {
    h = `<div class="area" data-anim="fadeUp:0.0:0.3">${S.area}</div>
      <div class="tlabel">${words(sc.text, 0.05, 0.06)}</div>
      <div class="tval" data-anim="slam:0.35:0.35"><span data-count="${sc.value}" data-at="0.4" data-du="1.3">${sc.value}</span></div>
      ${sc.sub ? `<div class="tsub" data-anim="fadeUp:1.4:0.4">${sc.sub}</div>` : ""}
      ${sc.note ? `<div class="note2" data-anim="fadeUp:1.6:0.4">${sc.note}</div>` : ""}
      <div class="propbox" style="top:1010px" data-anim="fadeUp:0.2:0.4"><div style="transform:scale(.6);transform-origin:center top">${PROPS.piggy()}</div></div>`;
  } else if (sc.kind === "point") {
    h = `<div class="area" data-anim="fadeUp:0.0:0.3">${S.area}</div>
      <div class="badge"><div class="num" data-anim="popIn:0.05:0.4">${sc.n}</div><div class="of" data-anim="fadeUp:0.15:0.35">STEP ${sc.n} OF ${sc.of}</div></div>
      <div class="pt">${words(sc.text, 0.12, 0.05)}</div>${sc.note ? `<div class="note" data-anim="fadeUp:0.5:0.4">${sc.note}</div>` : ""}
      <div class="propbox">${(PROPS[sc.prop] || PROPS.house)()}</div>`;
  } else {
    h = `<div class="wedge" data-anim="wipeIn:0.1:0.5"></div><div class="head" data-anim="headIn:0.2:0.6"><img src="../posts/assets/headshot-cutout.png"></div>
      <div class="cta">${words(sc.text, 0.1, 0.07)}</div>
      <div class="phone" data-anim="pulse:0.6:${Math.max(1, D[k] - 0.6).toFixed(2)}">905-452-4298</div>
      <div class="fine" data-anim="fadeUp:0.8:0.4">${sc.fine || ""}</div>`;
  }
  el.innerHTML = h; root.appendChild(el);
});
const ease = p => 1 - Math.pow(1 - p, 3), back = p => { const c = 1.70158; p -= 1; return 1 + (c + 1) * p * p * p + c * p * p; };
const A = {
  wordUp: p => `opacity:${Math.min(1, p * 2)};transform:translateY(${(1 - back(p)) * 60}px) scale(${0.9 + 0.1 * ease(p)})`,
  fadeUp: p => `opacity:${p};transform:translateY(${(1 - ease(p)) * 30}px)`,
  popIn: p => `opacity:${Math.min(1, p * 3)};transform:scale(${back(p)})`,
  headIn: p => `opacity:${Math.min(1, p * 2)};transform:translateY(${(1 - back(p)) * 400}px)`,
  wipeIn: p => `clip-path:polygon(32% ${100 - 100 * ease(p)}%,100% ${100 - 100 * ease(p)}%,100% 100%,0 100%)`,
  flyInRight: p => `opacity:${Math.min(1, p * 2)};transform:translateX(${(1 - back(p)) * 900}px) rotate(${(1 - ease(p)) * 25}deg)`,
  flyInLeft: p => `opacity:${Math.min(1, p * 2)};transform:translateX(${-(1 - back(p)) * 900}px) rotate(${-(1 - ease(p)) * 25}deg)`,
  flyInTop: p => `opacity:${Math.min(1, p * 2)};transform:translateY(${-(1 - back(p)) * 800}px) rotate(${(1 - ease(p)) * 15}deg)`,
  riseIn: p => `opacity:${Math.min(1, p * 2)};transform:translateY(${(1 - back(p)) * 700}px)`,
  dropBang: p => { const r = p < 0.6 ? -40 + 50 * (p / 0.6) : 10 - 10 * ((p - 0.6) / 0.4); return `opacity:${Math.min(1, p * 4)};transform:rotate(${r}deg) translateY(${(1 - Math.min(1, p / 0.6)) * -300}px)`; },
  stamp: p => `opacity:${Math.min(1, p * 4)};transform:scale(${p < 0.6 ? 2.6 - 1.7 * (p / 0.6) : 0.9 + 0.1 * ((p - 0.6) / 0.4)})`,
  draw: p => `stroke-dasharray:1;stroke-dashoffset:${1 - ease(p)}`,
  swing: p => `opacity:${Math.min(1, p * 5)};transform:rotate(${Math.sin(p * Math.PI * 4) * 18 * (1 - p)}deg)`,
  dropIn: p => `opacity:${Math.min(1, p * 3)};transform:translateY(${-(1 - back(p)) * 600}px)`,
  growUp: p => `transform:scaleY(${back(p)})`,
  scan: p => `opacity:${Math.min(1, p * 5)};transform:translate(${Math.sin(p * Math.PI * 2) * -180}px,${Math.sin(p * Math.PI) * 60}px)`,
  coinDrop: p => `opacity:${p < 0.85 ? 1 : (1 - p) / 0.15};transform:translateY(${ease(p) * 230}px)`,
  clipIn: p => `opacity:${Math.min(1, p * 3)};transform:translateY(${(1 - back(p)) * 260}px) rotate(${-14 + 11 * back(p)}deg) scale(${1.25 - 0.25 * ease(p)})`,
  slam: p => `transform:scale(${p >= 1 ? 1 : 1.35 - 0.35 * ease(p)});filter:blur(${(1 - Math.min(1, p * 1.4)) * 6}px)`,
  kickIn: p => `transform:scale(${p >= 1 ? 1 : back(p)}) rotate(${(1 - ease(p)) * -8}deg)`,
  teaseIn: p => `opacity:${p};transform:translateX(${(1 - back(p)) * -300}px)`,
  shake: p => `transform:rotate(${Math.sin(p * Math.PI * 6) * 4 * (1 - p)}deg) scale(${1 + 0.05 * Math.sin(p * Math.PI)})`,
  wipeL: p => `clip-path:inset(0 ${100 - 100 * ease(p)}% 0 0)`,
  pulse: p => `transform:scale(${1 + 0.06 * Math.max(0, Math.sin(p * Math.PI * 6))})`,
};
[0, 1, 2, 3, 4].forEach(i => { const ang = (i - 2) * 16; A["fan" + i] = p => `opacity:${Math.min(1, p * 3)};transform:rotate(${ang * back(p)}deg) translateY(${(1 - ease(p)) * 500}px)`; });
const TRANS = ["whip", "zoom", "slideUp"]; const TD = 0.32;
function trans(kind, p, dir) { // dir: 1 = entering (p 0->1), -1 = leaving (p 0->1)
  const e = ease(p);
  if (kind === "whip") { const x = dir > 0 ? (1 - e) * 1080 : -e * 1080; const b = Math.sin(p * Math.PI) * 26; return `transform:translateX(${x}px);filter:blur(${b}px)`; }
  if (kind === "zoom") { const s = dir > 0 ? 1.35 - 0.35 * e : 1 + 0.5 * e; return `transform:scale(${s});opacity:${dir > 0 ? e : 1 - e};filter:blur(${Math.sin(p * Math.PI) * 14}px)`; }
  const y = dir > 0 ? (1 - e) * 1920 : -e * 600; return `transform:translateY(${y}px);opacity:${dir > 0 ? 1 : 1 - e}`;
}
const anims = [...document.querySelectorAll("[data-anim]")].map(el => {
  const [n, dl, du] = el.dataset.anim.split(":"); const k = +el.closest(".scene").dataset.k; return { el, n, at: START[k] + +dl, du: +du };
});
const counts = [...document.querySelectorAll("[data-count]")].map(el => {   // count a value up from 0 (keeps $, commas, %, decimals)
  const full = el.dataset.count, k = +el.closest(".scene").dataset.k, m = full.match(/[\d][\d,]*(\.\d+)?/);
  if (!m) return null; const num = parseFloat(m[0].replace(/,/g, "")), dec = m[1] ? m[1].length - 1 : 0;
  const fmt = v => full.replace(m[0], v.toLocaleString("en-CA", {minimumFractionDigits: dec, maximumFractionDigits: dec}));
  return { el, full, num, fmt, at: START[k] + +el.dataset.at, du: +el.dataset.du };
}).filter(Boolean);
window.renderAt = t => {
  document.getElementById("prog").style.width = (100 * t / TOTAL) + "%";
  document.getElementById("b1").style.transform = `translate(${Math.sin(t * 0.6) * 120}px,${Math.cos(t * 0.4) * 160}px)`;
  document.getElementById("b2").style.transform = `translate(${Math.cos(t * 0.5) * 140}px,${Math.sin(t * 0.7) * 120}px)`;
  document.querySelectorAll(".scene").forEach(el => {
    const k = +el.dataset.k, s = START[k], e = s + D[k], last = k === D.length - 1;
    if (t < s || (!last && t >= e + TD)) { el.style.cssText = "display:none"; return; }
    let css = "";
    if (!last && t >= e) css = trans(TRANS[k % 3], (t - e) / TD, -1);           // leaving, while the next one enters
    else if (k > 0 && t < s + TD) css = trans(TRANS[(k - 1) % 3], (t - s) / TD, 1);
    el.style.cssText = css + (!last && t >= e ? ";z-index:1" : ";z-index:2");
  });
  counts.forEach(c => { const p = Math.max(0, Math.min(1, (t - c.at) / c.du)); c.el.textContent = p >= 1 ? c.full : c.fmt(c.num * ease(p)); });
  anims.forEach(a => { let p = (t - a.at) / a.du; p = Math.max(0, Math.min(1, p));
    if (a.n === "pulse" || a.n === "swing") { a.el.style.cssText = A[a.n](p); return; }
    a.el.style.cssText = A[a.n] ? A[a.n](p) : ""; });
};
window.TOTAL = TOTAL;
// Sound-effect cue list, timed to the animations (read by scripts/render_motion.py)
window.sfxEvents = () => {
  const ev = [];
  S.scenes.forEach((sc, k) => { if (sc.kind === "total") ev.push({ t: Math.max(0, START[k] - 0.7), s: "riser", v: 0.9 }); });   // build-up into the big reveal
  START.forEach((s, k) => { if (k > 0) ev.push({ t: Math.max(0, s - 0.12), s: "whoosh", v: 1 }); });
  anims.forEach(a => {
    if (a.n === "stamp") ev.push({ t: a.at + a.du * 0.6, s: "thud", v: 1 });
    else if (["popIn", "kickIn"].includes(a.n)) ev.push({ t: a.at + 0.03, s: "pop", v: 0.8 });
    else if (a.n === "slam") ev.push({ t: a.at, s: "thud", v: 0.6 });
    else if (a.n === "clipIn") ev.push({ t: a.at + 0.3, s: "thud", v: 0.5 });
    else if (a.n === "teaseIn") ev.push({ t: a.at + 0.05, s: "pop", v: 0.5 });
    else if (a.n === "wipeL") ev.push({ t: a.at, s: "whoosh", v: 0.7 });
  });
  counts.forEach(c => {
    for (let x = 0; x < c.du; x += 0.085) ev.push({ t: c.at + x, s: "tick", v: 0.5 });
    if (c.el.closest(".tval")) ev.push({ t: c.at + c.du, s: "kaching", v: 1 });
  });
  return ev.filter(e => e.t < TOTAL - 0.05).sort((a, b) => a.t - b.t);
};

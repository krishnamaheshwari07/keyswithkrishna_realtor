/* Layout: single reading column, brand-green header band, plain policy sections */
:root{--bg:#fbf8f1;--fg:#16231f;--muted:#55635e;--band:#04211d;--band-fg:#fbf8f1;--gold:#b88a0e;--rule:#e2dccb;
--display:"Playfair Display",Georgia,serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a17;--fg:#e9e4d6;--muted:#a3b0aa;--band:#04211d;--band-fg:#fbf8f1;--gold:#e8b923;--rule:#22362f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1a17;--fg:#e9e4d6;--muted:#a3b0aa;--band:#04211d;--band-fg:#fbf8f1;--gold:#e8b923;--rule:#22362f;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:17px/1.6 var(--body)}
header{background:var(--band);color:var(--band-fg);padding-block:40px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:68ch;margin:0 auto}
.mark{font-weight:600;letter-spacing:.18em;font-size:13px;color:#e8b923;text-transform:uppercase}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:10px 0 8px;text-wrap:balance}
.eff{color:#c9d4cf;font-size:15px}
main{padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{border-top:1px solid var(--rule);padding-top:18px;margin-top:22px}
section:first-child{border-top:0;margin-top:0;padding-top:0}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 8px;text-wrap:balance}
p,li{margin:0 0 10px}
ul{padding-left:20px;margin:0 0 10px}
.contact{display:grid;gap:4px;font-variant-numeric:tabular-nums}
.contact b{color:var(--gold);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px}

</style><header><div class="wrap"><div class="mark">Keys with Krishna</div><h1>Connect YouTube</h1><div class="eff">Krishna Rander, Realtor® · PROPERTY.CA INC., Brokerage</div></div></header><main><div class="wrap"><section><h2>Connect YouTube</h2><p id="msg">Waiting for Google…</p><p><code id="code" style="word-break:break-all;font-size:15px"></code></p></section>
<script>
const p=new URLSearchParams(location.search),c=p.get("code"),e=p.get("error");
const m=document.getElementById("msg");
if(c){m.textContent="Google approved the connection. Copy this code and paste it into the GitHub 'Connect YouTube' step within a few minutes:";document.getElementById("code").textContent=c;}
else if(e){m.textContent="Google returned an error: "+e+" "+(p.get("error_description")||"");}
</script></div></main></html>

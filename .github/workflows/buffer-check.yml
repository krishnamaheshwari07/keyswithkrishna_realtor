name: Buffer status check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/buffer_check.py
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL: ${{ vars.BUFFER_TIKTOK_CHANNEL }}
      - run: |
          git config user.name "kwk-bot"; git config user.email "bot@users.noreply.github.com"
          git pull -q --rebase || true
          git add data/buffer-status.json && (git commit -m "Buffer status check" && git push) || true

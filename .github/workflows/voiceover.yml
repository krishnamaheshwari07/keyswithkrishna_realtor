name: Reel voiceover (Krishna's cloned voice)
on:
  push:
    branches: [main]
    paths: ['posts/**/schedule.json']
  schedule: [{cron: "5,35 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voiceover
  cancel-in-progress: false
jobs:
  voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: set -o pipefail; python3 scripts/voiceover.py --check | tee -a "$GITHUB_OUTPUT"
      - if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - if: steps.check.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: vo-models-v1
      - if: steps.check.outputs.run == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg sox libsox-dev
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q qwen-tts demucs soundfile faster-whisper playwright
          python -m playwright install --with-deps chromium
      - if: steps.check.outputs.run == 'true'
        run: python scripts/voiceover.py
        env:
          VOICE_KEY_EN2: ${{ secrets.VOICE_KEY_EN2 }}

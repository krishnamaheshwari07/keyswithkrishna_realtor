name: Fetch whisper model
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/whisper-model.yml"]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q huggingface_hub && python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-small.en', local_dir='model')"
      - uses: actions/upload-artifact@v4
        with: {name: whisper-small-en, path: model, retention-days: 1}

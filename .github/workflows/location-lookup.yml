name: Location lookup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/location-lookup.yml', 'scripts/location_lookup.py']
permissions:
  contents: write
concurrency:
  group: publish
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin main && git reset -q --hard origin/main
      - run: python3 scripts/location_lookup.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - run: |
          git config user.name "kwk-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A data && (git commit -m "Location lookup" && git push) || true

name: Publish approved Instagram posts
on:
  schedule: [{cron: "*/10 * * * *"}]
  push:
    branches: [main]
    paths: ['posts/**/schedule.json', 'scripts/publish.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false   # never two publish runs at once: overlapping runs posted the same item several times (Oct 28)
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin main && git reset -q --hard origin/main   # a queued run starts from the latest statuses, not the triggering commit
      - run: python3 scripts/publish.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_TOKEN_KEY: ${{ secrets.TIKTOK_TOKEN_KEY }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL: ${{ vars.BUFFER_TIKTOK_CHANNEL }}
      - run: |
          git config user.name "kwk-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A posts data && (git commit -m "Update post statuses" && git push) || true

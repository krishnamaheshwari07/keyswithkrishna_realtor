name: Connect TikTok
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code shown on the Connect TikTok page"
        required: true
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tiktok.py connect "$CODE"
        env:
          CODE: ${{ inputs.code }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_TOKEN_KEY: ${{ secrets.TIKTOK_TOKEN_KEY }}
      - run: |
          git config user.name "kwk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/tiktok-token.enc && git commit -m "Connect TikTok (encrypted token)" && git push
